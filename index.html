// Apply release metadata to both the static shell and route-generated markup.
function syncReleaseLabels() {
  document.querySelectorAll('[data-app-build]').forEach(element => {
    element.textContent = RELEASE.version;
  });

  document.querySelectorAll('[data-app-release-date]').forEach(element => {
    element.textContent = RELEASE.releaseDate;
  });
}

syncReleaseLabels();

function route(name, id){
  if(name==='doc' && id){ location.hash='doc/'+id; }
  else location.hash=name;
  renderRoute();
}
function renderRoute(){
  const parts=location.hash.replace(/^#/,'').split('/');
  const page=parts[0]||'home', id=parts[1];
  document.querySelectorAll('#desktopNav button').forEach(b=>b.classList.toggle('active',b.dataset.route===page || (page==='doc'&&b.dataset.route==='docs')));
  if(page==='doc' && id) renderDoc(id);
  else if(page==='docs') renderDocs();
  else if(page==='toolkit') renderToolkit();
  else if(page==='download') renderDownload();
  else renderHome();
  renderSidebar(page,id);
  syncReleaseLabels();
  window.scrollTo(0,0);
}
function renderSidebar(page,id){
  const s=document.getElementById('sidebar');
  if(page==='docs'||page==='doc'){
    s.innerHTML='<div class="side-title">Documentation</div>'+sections.map(sec=>{
      const items=docs.filter(d=>d.section===sec);
      return `<div class="side-group"><div class="side-section">${sec}</div>${items.map(d=>`<button class="side-link ${d.id===id?'active':''}" onclick="route('doc','${d.id}')">${d.title}</button>`).join('')}</div>`;
    }).join('');
  } else if(page==='toolkit') {
    s.innerHTML='<div class="side-title">Toolkit groups</div>'+toolCategories().map(category=>`
      <button class="side-link ${activeToolCat===category?'active':''}" onclick="selectToolCategory('${escapeHtml(category)}')">${escapeHtml(category)}</button>
    `).join('')+'<div class="side-note">Choose a group to show only the tools assigned to it.</div>';
  } else {
    s.innerHTML=`<div class="side-title">Quick navigation</div>
      <button class="side-link ${page==='home'?'active':''}" onclick="route('home')">Overview</button>
      <button class="side-link" onclick="route('docs')">All documentation</button>
      <button class="side-link" onclick="route('toolkit')">All tools</button>
      <button class="side-link" onclick="route('download')">Download</button>`;
  }
}

/* ---------------------------------------------------------
   CHANGE CATEGORY
   --------------------------------------------------------- */

function selectToolCategory(category) {

    activeToolCat = toolCategories().includes(category)
      ? category
      : "All";

    renderSidebar('toolkit');

    const searchInput =
        document.getElementById("toolSearch");

    filterTools(
        searchInput
            ? searchInput.value
            : ""
    );
}


/* ---------------------------------------------------------
   GET TOOL CATEGORY
   --------------------------------------------------------- */

function toolCategory(tool) {

    return tool &&
           tool.category &&
           tool.category.trim()
        ? tool.category.trim()
  : "Other Tools";
}


/* ---------------------------------------------------------
   FILTER TOOLS
   --------------------------------------------------------- */

function filterTools(search = "") {

    const grid = document.getElementById("toolGrid");
    const count = document.getElementById("toolCount");

    if (!grid || !count) return;

    search = search.trim().toLowerCase();

    const filtered = tools.filter(tool => {

        const category =
            toolCategory(tool);

        const categoryMatch =
            activeToolCat === "All" ||
            category === activeToolCat;

        if (!categoryMatch) return false;

        if (!search) return true;

        const text = [
            tool.name,
            category,
            tool.desc,
            tool.details
        ]
        .join(" ")
        .toLowerCase();

        return text.includes(search);
    });

    count.textContent =
        `${filtered.length} tools`;

    if (!filtered.length) {

        grid.innerHTML = `
            <div class="empty">
                <strong>No tools found</strong>
                <p>
                    Try another search term
                    or choose a different
                    category.
                </p>
            </div>
        `;

        return;
    }

    grid.innerHTML =
        filtered.map(tool => {

            const index =
                tools.indexOf(tool);

            return `
                <button
                    class="tool-card"
                    onclick="openTool(${index})">

                  <img src="assets/tool-icon.svg" alt="">

                    <div class="tool-card-content">

                        <span class="tool-category">
                          ${escapeHtml(toolCategory(tool))}
                        </span>

                        <h3>${escapeHtml(tool.name)}</h3>

                        <p>${escapeHtml(tool.desc)}</p>

                    </div>

                </button>
            `;

        }).join("");
}

function focusSearch() {
  const input = document.getElementById('headerSearch');

  if (input) {
    input.focus();
    input.select();
  }
}


function openSearchOverlay() {
  const overlay = document.getElementById('searchOverlay');
  const input = document.getElementById('globalSearch');

  if (!overlay || !input) {
    return;
  }

  overlay.classList.add('open');

  requestAnimationFrame(() => {
    input.focus();
    input.select();
  });

  renderSearch(input.value || '');
}


function closeSearch() {
  const overlay = document.getElementById('searchOverlay');

  if (overlay) {
    overlay.classList.remove('open');
  }
}

/* Search the local documentation and toolkit from the Ctrl/Cmd + K palette. */
function buildSearchHits(q) {
  q = (q || '').trim();
  if (!q) return [];

  const query = q.toLowerCase();
  const hits = [];

  docs.forEach(d => {
    const text = (
      d.title + ' ' +
      d.summary + ' ' +
      d.section + ' ' +
      d.body.flat().join(' ')
    ).toLowerCase();

    if (text.includes(query)) {
      hits.push({
        type: 'Documentation',
        title: d.title,
        meta: d.section,
        action: () => { closeSearch(); route('doc', d.id); }
      });
    }
  });

  tools.forEach((t, i) => {
    const text = (
      t.name + ' ' +
      t.desc + ' ' +
      (t.details || '')
    ).toLowerCase();

    if (text.includes(query)) {
      hits.push({
        type: 'Tool',
        title: t.name,
        meta: toolCategory(t),
        action: () => {
          closeSearch();
          route('toolkit');
          setTimeout(() => { openTool(i); }, 50);
        }
      });
    }
  });

  return hits;
}

function renderSearch(q) {
  const results = document.getElementById('searchResults');
  if (!results) return;

  q = (q || '').trim();

  if (!q) {
    results.innerHTML = '<div class="search-empty"></div>';
    return;
  }
  const hits = buildSearchHits(q);

  if (!hits.length) {
    results.innerHTML = `<div class="search-empty">No documentation or tools found for <strong>${escapeHtml(q)}</strong></div>`;
    return;
  }

  results.innerHTML = hits.slice(0, 20).map((h, i) => `
    <button class="search-result" data-search-index="${i}">
      <span class="search-result-type">${h.type}</span>
      <span class="search-result-content">
        <strong>${escapeHtml(h.title)}</strong>
        <small>${escapeHtml(h.meta)}</small>
      </span>
      <span class="search-result-arrow">→</span>
    </button>
  `).join('');

  results.querySelectorAll('.search-result').forEach((button, index) => {
    button.onclick = () => { if (hits[index]) hits[index].action(); };
  });
}

function handleGlobalSearchKey(event) {
  if (event.key === 'Enter') {
    const first = document.querySelector('#searchResults .search-result');
    if (first) first.click();
  }
  if (event.key === 'Escape') {
    closeSearch();
  }
}


function renderHeaderSearch(q) {

  const results =
    document.getElementById('headerSearchResults');

  if (!results) {
    return;
  }

  q = q.trim();

  if (!q) {
    results.classList.remove('show');
    results.innerHTML = '';
    return;
  }

  const hits = buildSearchHits(q);

  if (!hits.length) {

    results.innerHTML = `
      <div class="header-search-empty">
        No documentation or tools found for
        <strong>${escapeHtml(q)}</strong>
      </div>
    `;

    results.classList.add('show');

    return;
  }


  results.innerHTML = hits
    .slice(0, 8)
    .map((h, i) => `
      <button
        class="header-search-result"
        data-search-index="${i}"
      >
        <span class="header-result-type">
          ${h.type}
        </span>

        <span class="header-result-content">

          <strong>
            ${escapeHtml(h.title)}
          </strong>

          <small>
            ${escapeHtml(h.meta)}
          </small>

        </span>

        <span class="header-result-arrow">
          →
        </span>

      </button>
    `)
    .join('');


  results.classList.add('show');


  results
    .querySelectorAll('.header-search-result')
    .forEach((button, index) => {

      button.onclick = () => {

        if (hits[index]) {
          hits[index].action();
        }

      };

    });

}


function handleHeaderSearchKey(event) {

  if (event.key === 'Enter') {

    const firstResult =
      document.querySelector(
        '.header-search-result'
      );

    if (firstResult) {
      firstResult.click();
    }

  }

  if (event.key === 'Escape') {

    clearHeaderSearch();

    event.target.blur();

  }

}


function clearHeaderSearch() {

  const input =
    document.getElementById('headerSearch');

  const results =
    document.getElementById('headerSearchResults');

  if (input) {
    input.value = '';
  }

  if (results) {
    results.classList.remove('show');
    results.innerHTML = '';
  }

}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}

function toggleMenu(){document.getElementById('mobileNav').classList.toggle('open')}
document.addEventListener('keydown', e => {

  if (
    (e.ctrlKey || e.metaKey) &&
    e.key.toLowerCase() === 'k'
  ) {

    e.preventDefault();

    openSearchOverlay();

    return;
  }


  if (e.key === 'Escape') {

    closeSearch();

  }

});
